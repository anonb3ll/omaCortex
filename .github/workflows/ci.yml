name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Panel model tests
        run: node --test tests/model.test.js
      - name: Manifest and i18n are valid JSON
        run: |
          jq empty manifest.json i18n/en.json
      - name: CLI smoke test through the plugin launcher
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/d
          XDG_STATE_HOME: ${{ runner.temp }}/s
          XDG_CONFIG_HOME: ${{ runner.temp }}/c
        run: |
          cargo build --release --locked
          bin/omacortex --version
          bin/omacortex status
          bin/omacortex panel-json | jq -e '.status.consent == false'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | bin/omacortex mcp | jq -s -e '.[1].result.tools | length == 8'
          ls -l target/release/omacortex
