name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh-install version resolution
        run: scripts/fresh-install-version-test.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Panel model and browser extension tests
        run: node --test tests/model.test.js tests/extension.test.mjs
      - name: Manifests and i18n are valid JSON, versions agree
        run: |
          jq empty manifest.json i18n/en.json extension/manifest.json
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$(jq -r .version manifest.json)" = "$version"
          test "$(jq -r .version extension/manifest.json)" = "$version"
      - name: CLI smoke test through the plugin launcher
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/d
          XDG_STATE_HOME: ${{ runner.temp }}/s
          XDG_CONFIG_HOME: ${{ runner.temp }}/c
        run: |
          cargo build --release --locked
          bin/omacortex --version
          bin/omacortex status
          bin/omacortex panel-json | jq -e '.status.consent == false'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | bin/omacortex mcp | jq -s -e '.[1].result.tools | length == 11'
          bin/omacortex browser path | grep -qx "$PWD/extension"
          # The browser's native-messaging framing: a status request, a 4-byte length each way.
          printf '\x1e\x00\x00\x00{"v":1,"type":"status"}       ' \
            | bin/omacortex chrome-extension://kifhcmopbipadknlobfmidehjfgamjdl/ | tail -c +5 | jq -e '.ok and .consent == false'
          ls -l target/release/omacortex

  # Install the published release the way a machine without Rust does.
  # Doctor is expected to miss Hyprland here; the job asserts that documented
  # line instead of planting a socket.
  fresh-install:
    name: fresh user install from the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install via install.sh --download into a clean home
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/omacortex-home"
          rm -rf "$home"
          mkdir -p "$home"
          export HOME="$home"
          export XDG_CONFIG_HOME="$home/.config"
          export XDG_DATA_HOME="$home/.local/share"
          export XDG_STATE_HOME="$home/.local/state"
          export XDG_CACHE_HOME="$home/.cache"
          export XDG_RUNTIME_DIR="$home/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset HYPRLAND_INSTANCE_SIGNATURE || true
          export PATH="$home/.local/bin:${PATH}"

          latest=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name')
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$latest"
          test -n "$version"
          tag_line=$(git ls-remote --tags origin "refs/tags/v${version}")
          if [ -n "$tag_line" ]; then
            tag_exists=yes
          else
            tag_exists=no
          fi
          # Unreleased pull requests install the latest published release.
          # Pushes to main and tag refs still require that release to match Cargo.toml.
          expected=$(scripts/fresh-install-version.sh \
            "$GITHUB_EVENT_NAME" "$version" "$latest" "$tag_exists" "$GITHUB_REF")
          test -n "$expected"
          printf 'installing published release %s (checkout %s, event %s)\n' \
            "$expected" "$version" "$GITHUB_EVENT_NAME"

          OMACORTEX_INSTALL_VERSION="$expected" ./install.sh --download
          test -x libexec/omacortex
          test ! -e target/release/omacortex
          test -L "$HOME/.local/bin/omacortex"
          test -x "$HOME/.local/bin/omacortex"

          version_out=$(omacortex --version)
          printf '%s\n' "$version_out"
          grep -F -q "omacortex ${expected}" <<<"$version_out"

          set +e
          doctor_out=$(omacortex doctor)
          doctor_code=$?
          set -e
          printf '%s\n' "$doctor_out"
          # Checks are printed and the process exits 0. A missing compositor or
          # media player is a failed line, not a crash, and this job does not
          # invent a Hyprland socket or an MPRIS player.
          test "$doctor_code" -eq 0
          grep -q 'hyprland socket' <<<"$doctor_out"
          grep -F -q 'no running Hyprland instance' <<<"$doctor_out"
          grep -F -q "$XDG_DATA_HOME/omacortex/cortex.db" <<<"$doctor_out"
          busctl_line=$(printf '%s\n' "$doctor_out" | grep -F 'busctl (media)')
          test -n "$busctl_line"
          if grep -q '^!!' <<<"$busctl_line"; then
            grep -F -q 'missing' <<<"$busctl_line"
          else
            grep -F -q 'player(s)' <<<"$busctl_line"
          fi

  identity:
    name: identity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan introduced commits for credentials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/secret-scan.sh git "$HEAD_SHA" "$BASE_SHA"
      - name: Fixture rejects a planted Gmail commit
        run: scripts/identity-gate-test.sh
      - name: Tracked files
        run: scripts/identity-gate.sh files
      - name: New commits only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}" || git fetch --no-tags origin "$HEAD_SHA"
          scripts/identity-gate.sh commits "$BASE_SHA" "$HEAD_SHA"
      - name: Commits pushed to main
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # A push that creates the branch, or one that rewrote history, has no
          # usable base: scan everything reachable from the new head instead.
          root=$(git rev-list --max-parents=0 "$AFTER_SHA" | tail -n 1)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
             || ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"; then
            scripts/identity-gate.sh commits "$root" "$AFTER_SHA"
            git log -1 --format='%ae%n%ce' "$root" | while read -r who; do
              case "$who" in anonb3ll@pm.me|*@users.noreply.github.com|noreply@github.com) ;; *) echo "root commit identity not allowed"; exit 1;; esac
            done
          else
            scripts/identity-gate.sh commits "$BEFORE_SHA" "$AFTER_SHA"
          fi
