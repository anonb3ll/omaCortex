name: e2e-browser

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e-browser:
    name: browser end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Chromium
        run: |
          set -euo pipefail
          if ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y chromium
          fi
          chromium --version
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --dump-dom 'data:text/html,<p>ok</p>' | grep -q ok
      - name: Release binary
        run: cargo build --release --locked
      - name: End-to-end browser test
        env:
          OMACORTEX_BIN: ${{ github.workspace }}/target/release/omacortex
          CHROMIUM: chromium
          CHROMIUM_ARGS: --no-sandbox --disable-dev-shm-usage
        run: node tests/e2e-browser.mjs
