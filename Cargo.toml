[package]
name = "omacortex"
version = "0.3.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A private, local memory of your day for Omarchy, with an MCP server for agents."
repository = "https://github.com/anonb3ll/omaCortex"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
libc = "0.2"
quick-xml = "0.42"
regex-lite = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
