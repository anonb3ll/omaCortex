[project]
name = "omacortex"
version = "0.1.0"
description = "A private, local memory of what you do on your Omarchy desktop, with an MCP server for agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omacortex = "omacortex.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603", "S607", "S310", "S608", "E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
